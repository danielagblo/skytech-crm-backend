server:
  port: ${PORT:8080}

spring:
  application:
    name: skytech-crm
  datasource:
    url: ${DATABASE_URL}
    username: ${DATABASE_USERNAME}
    password: ${DATABASE_PASSWORD}
    hikari:
      maximum-pool-size: ${DB_POOL_MAX_SIZE:5}
      minimum-idle: ${DB_POOL_MIN_IDLE:1}
      connection-timeout: ${DB_CONNECTION_TIMEOUT_MS:30000}
  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: false
    open-in-view: false
  jackson:
    property-naming-strategy: SNAKE_CASE
  flyway:
    enabled: true
    locations: classpath:db/migration
  mail:
    host: ${MAIL_HOST:localhost}
    port: ${MAIL_PORT:587}
    username: ${MAIL_USERNAME:}
    password: ${MAIL_PASSWORD:}
    properties.mail.smtp.auth: true
    properties.mail.smtp.starttls.enable: true
  servlet:
    multipart:
      max-file-size: 10MB
      max-request-size: 10MB
  data:
    web:
      pageable:
        default-page-size: 20
        max-page-size: 100
jwt:
  secret: ${JWT_SECRET}
  access-token-expiry-ms: 900000
  refresh-token-expiry-ms: 604800000
twilio:
  account-sid: ${TWILIO_ACCOUNT_SID:}
  auth-token: ${TWILIO_AUTH_TOKEN:}
  from-number: ${TWILIO_FROM_NUMBER:}
stripe:
  secret-key: ${STRIPE_SECRET_KEY:}
cors:
  allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:3000}
app:
  time-zone: ${APP_TIME_ZONE:Africa/Accra}
mail:
  host: ${MAIL_HOST:localhost}
  port: ${MAIL_PORT:587}
  username: ${MAIL_USERNAME:}
  password: ${MAIL_PASSWORD:}
  from: ${MAIL_FROM:}
invoice:
  issuer-name: ${INVOICE_ISSUER_NAME:Skytech}
  issuer-email: ${INVOICE_ISSUER_EMAIL:}
  issuer-phone: ${INVOICE_ISSUER_PHONE:}
  issuer-address: ${INVOICE_ISSUER_ADDRESS:}
  issuer-tax-id: ${INVOICE_ISSUER_TAX_ID:}
  payment-instructions: ${INVOICE_PAYMENT_INSTRUCTIONS:}
management:
  health:
    mail:
      enabled: ${MAIL_HEALTH_ENABLED:false}
springdoc:
  swagger-ui:
    path: /swagger-ui.html
