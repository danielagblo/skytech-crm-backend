server:
  port: ${PORT:8080}

spring:
  application:
    name: skytech-crm
  datasource:
    url: ${DATABASE_URL}
    username: ${DATABASE_USERNAME}
    password: ${DATABASE_PASSWORD}
    hikari:
      maximum-pool-size: ${DB_POOL_MAX_SIZE:5}
      minimum-idle: ${DB_POOL_MIN_IDLE:1}
      connection-timeout: ${DB_CONNECTION_TIMEOUT_MS:30000}
  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: false
    open-in-view: false
  jackson:
    property-naming-strategy: SNAKE_CASE
  flyway:
    enabled: true
    locations: classpath:db/migration
  mail:
    host: ${MAIL_HOST:smtp.gmail.com}
    port: ${MAIL_PORT:587}
    username: ${MAIL_USERNAME:info@skytechghana.com}
    password: ${MAIL_PASSWORD:}
    properties.mail.smtp.auth: true
    properties.mail.smtp.starttls.enable: true
  servlet:
    multipart:
      max-file-size: 10MB
      max-request-size: 10MB
  data:
    web:
      pageable:
        default-page-size: 20
        max-page-size: 100
jwt:
  secret: ${JWT_SECRET}
  access-token-expiry-ms: 900000
  refresh-token-expiry-ms: 604800000
communication:
  sms-provider: ${COMMUNICATION_SMS_PROVIDER:arkesel}
arkesel:
  sms:
    api-url: ${ARKESEL_SMS_API_URL:https://sms.arkesel.com/api/v2/sms/send}
    api-key: ${ARKESEL_SMS_API_KEY:}
    sender-id: ${ARKESEL_SMS_SENDER_ID:Skytech}
    sandbox: ${ARKESEL_SMS_SANDBOX:false}
    default-country-code: ${ARKESEL_DEFAULT_COUNTRY_CODE:233}
stripe:
  secret-key: ${STRIPE_SECRET_KEY:}
cors:
  allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:3000}
app:
  time-zone: ${APP_TIME_ZONE:Africa/Accra}
mail:
  host: ${MAIL_HOST:smtp.gmail.com}
  port: ${MAIL_PORT:587}
  username: ${MAIL_USERNAME:info@skytechghana.com}
  password: ${MAIL_PASSWORD:}
  from: ${MAIL_FROM:info@skytechghana.com}
invoice:
  issuer-name: ${INVOICE_ISSUER_NAME:Skytech}
  issuer-email: ${INVOICE_ISSUER_EMAIL:info@skytechghana.com}
  issuer-phone: ${INVOICE_ISSUER_PHONE:}
  issuer-address: ${INVOICE_ISSUER_ADDRESS:}
  issuer-tax-id: ${INVOICE_ISSUER_TAX_ID:}
  payment-instructions: ${INVOICE_PAYMENT_INSTRUCTIONS:}
management:
  health:
    mail:
      enabled: ${MAIL_HEALTH_ENABLED:false}
springdoc:
  swagger-ui:
    path: /swagger-ui.html
